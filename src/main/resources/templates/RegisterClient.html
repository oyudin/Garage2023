<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create Client</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 30px;
        }

        .form-wrapper {
            max-width: 500px;
            margin: auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-wrapper .form-control {
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
        }

        .navbar {
            margin-bottom: 30px;
        }

        .form-wrapper h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-secondary, .btn-primary {
            margin-top: 10px;
        }
    </style>
</head>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:8080/carservice/clients">Мої клієнти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page">Новий клієнт</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<body>
<div class="container">
    <div class="form-wrapper">
        <form id="createClientForm">
            <h2>Створити клієнта</h2>

            <label for="name">Імʼя:</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Введіть імʼя" required>

            <label for="surname">Прізвище:</label>
            <input type="text" class="form-control" id="surname" name="surname" placeholder="Введіть прізвище" required>

            <label for="phoneNumber">Номер телефону:</label>
            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                   placeholder="Введіть номер телефону у форматі +380631234567"
                   required pattern="^\+?\d{1,3}\d{9}$"
                   title="Формат: 380631234567 або +380631234567">

            <button class="btn btn-outline-primary" id="backToClientsBtn" type="button">Повернутися до списку клієнтів</button>
            <button class="btn btn-primary" type="submit">Додати</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('createClientForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const formData = new FormData(event.target);
        const jsonData = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/carservice/clients', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            });

            if (response.ok) {
                showSuccessMessage();
                setTimeout(redirectToClientsPage, 2000);
            } else {
                alert('Помилка при створенні клієнта.');
            }
        } catch (error) {
            console.error('Помилка:', error);
        }
    });

    function showSuccessMessage() {
        const successAlert = document.createElement('div');
        successAlert.classList.add('alert', 'alert-success', 'mt-3');
        successAlert.textContent = 'Клієнт успішно створений!';

        const formWrapper = document.querySelector('.form-wrapper');
        formWrapper.appendChild(successAlert);
    }

    function redirectToClientsPage() {
        window.location.href = '/carservice/clients';
    }

    document.getElementById('backToClientsBtn').addEventListener('click', function () {
        redirectToClientsPage();
    });
</script>
</body>
</html>
