<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
        }

        .alert {
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Новий клієнт</h2>
    <form id="clientForm">
        <div class="mb-3">
            <label for="name" class="form-label">Ім'я</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Введіть ім'я" required>
        </div>
        <div class="mb-3">
            <label for="surname" class="form-label">Прізвище</label>
            <input type="text" class="form-control" id="surname" name="surname" placeholder="Введіть прізвище" required>
        </div>
        <div class="mb-3">
            <label for="phoneNumber" class="form-label">Номер телефону</label>
            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="напр: 380631234567"
                   required pattern="^\+?\d{1,3}\d{9}$"
                   title="Формат: 380631234567 или +380631234567">
        </div>

        <button type="submit" class="btn btn-primary">Додати</button>
        <div id="successMessage" class="alert alert-success d-none" role="alert">
            Клієнт успішно створений!
        </div>
    </form>
</div>

<script>
    document.getElementById('clientForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const formData = new FormData(event.target);
        const jsonData = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/carservice/clients', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            });

            if (response.ok) {
                const successMessage = document.getElementById('successMessage');
                successMessage.classList.remove('d-none');
                setTimeout(() => window.location.href = '/carservice/clients', 1500);
            } else {
                alert('Помилка при створенні клієнта.');
            }
        } catch (error) {
            console.error('Ошибка:', error);
        }
    });
</script>
</body>
</html>
