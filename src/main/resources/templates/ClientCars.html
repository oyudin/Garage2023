<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Авто клієнта</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 30px;
        }

        .card {
            margin-bottom: 20px;
        }

        #partsList {
            max-height: 550px;
            overflow-y: auto;
        }

        .card-title {
            font-weight: bold;
        }

        .custom-details {
            margin-top: 20px;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:8080/carservice/clients">Мої клієнти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Авто</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="text-center mb-4">Авто клієнта</h1>

    <div id="partsList">
        <div th:each="car : ${cars}" class="card"
             th:onclick="|window.location='@{/carservice/clients/{clientId}/cars/{carId}/service-history(clientId=${client.id}, carId=${car.id})}'|">
            <div class="card-body">
                <h5 class="card-title" th:text="${car.number}">Номер авто</h5>
                <p class="card-text" th:text="'Vin номер: ' + ${car.vin_code}">Vin номер</p>
                <p class="card-text" th:text="'Бренд: ' + ${car.brand}">Бренд</p>
                <p class="card-text" th:text="'Модель: ' + ${car.model}">Модель</p>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/carservice/clients/{clientId}/cars/{carId}/update(clientId=${client.id}, carId=${car.id})}"
                       class="btn btn-secondary">Редагувати</a>

                    <form th:action="@{/carservice/clients/{clientId}/cars/{carId}/delete(clientId=${client.id}, carId=${car.id})}"
                          method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цей запис?')">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="btn btn-danger">Видалити</button>
                    </form>
                </div>

                <div>
                    <a th:href="@{/carservice/clients/{clientId}/cars/{carId}/service-history(clientId=${client.id}, carId=${car.id})}"
                       class="btn btn-primary custom-details">Деталі обслуговування</a>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{/carservice/clients}" class="btn btn-outline-primary">Повернутися до списку
            клієнтів</a>
        <a th:href="@{/carservice/clients/{clientId}/cars/add(clientId=${client.id})}"
           class="btn btn-primary">Додати авто</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
