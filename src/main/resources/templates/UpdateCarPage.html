<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Update Car</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 30px;
        }

        .form-wrapper {
            max-width: 500px;
            margin: auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-wrapper .form-control {
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
        }

        .navbar {
            margin-bottom: 30px;
        }

        .form-wrapper h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-secondary, .btn-primary {
            margin-top: 10px;
        }

        .btn-secondary {
            width: auto;
            margin-right: 10px;
        }
    </style>
</head>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="http://localhost:8080/carservice/clients">Мої клієнти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page">Редагування авто</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<body>
<div class="container">
    <div class="form-wrapper">
        <form id="updateCarForm">
            <h2>Оновити інформацію про авто</h2>
            <input type="hidden" id="carId" value="">
            <input type="hidden" id="clientId" value="">

            <label for="number">Номер авто:</label>
            <input type="text" class="form-control" id="number" name="number" placeholder="Введіть номер авто" required>

            <label for="vin_code">Він код:</label>
            <input type="text" class="form-control" id="vin_code" name="vin_code" placeholder="Введіть він код" required>

            <label for="brand">Бренд:</label>
            <input type="text" class="form-control" id="brand" name="brand" placeholder="Введіть бренд" required>

            <label for="model">Модель:</label>
            <input type="text" class="form-control" id="model" name="model" placeholder="Введіть модель" required>

            <button class="btn btn-outline-primary" id="backToCarsBtn" type="button">Повернутися до списку авто</button>
            <button class="btn btn-primary" type="submit">Оновити</button>
        </form>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const urlParts = window.location.pathname.split('/');
        const clientId = parseInt(urlParts[urlParts.length - 4]);
        const carId = parseInt(urlParts[urlParts.length - 2]);
        const carForm = document.querySelector('#updateCarForm');
        const clientIdField = document.querySelector('#clientId');
        const carIdField = document.querySelector('#carId');

        clientIdField.value = clientId;
        carIdField.value = carId;

        // Fetch existing car data
        fetch(`/carservice/clients/${clientId}/cars/${carId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Network error: ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                document.querySelector('#number').value = data.number || '';
                document.querySelector('#vin_code').value = data.vin_code || '';
                document.querySelector('#brand').value = data.brand || '';
                document.querySelector('#model').value = data.model || '';
            })
            .catch(error => console.error('Getting car data error', error));

        // Submit updated car data
        carForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(carForm);
            const xhr = new XMLHttpRequest();
            const updateUrl = `/carservice/clients/${clientId}/cars/${carId}/update`;

            xhr.open('PATCH', updateUrl);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
                    console.log('Car updated successfully!');
                    showSuccessMessage();
                    setTimeout(redirectToCarsPage, 2000);
                }
            };
            xhr.send(JSON.stringify(Object.fromEntries(formData)));
        });

        function showSuccessMessage() {
            const successAlert = document.createElement('div');
            successAlert.classList.add('alert', 'alert-success', 'mt-3');
            successAlert.textContent = 'Інформація про авто оновлена успішно.';

            const formWrapper = document.querySelector('.form-wrapper');
            formWrapper.appendChild(successAlert);
        }

        function redirectToCarsPage() {
            window.location.href = `/carservice/clients/${clientId}/cars`;
        }

        // Back button logic
        const backToCarsBtn = document.querySelector('#backToCarsBtn');
        backToCarsBtn.addEventListener('click', function () {
            redirectToCarsPage();
        });
    });
</script>
</body>
</html>
