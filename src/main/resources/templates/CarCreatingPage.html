<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Update Car Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
        }

        .alert {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="http://localhost:8080/carservice/clients">Мої
                        клієнти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" a th:href="@{'/carservice/clients/' + ${ignoredClientId} + '/cars'}">Авто</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active">Додати авто</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <form class="form-signin" id="carForm">
        <h2 class="form-signin-heading">Нове авто</h2>
        <input type="hidden" id="clientId" value="">
        <p>
            <label class="form-label" for="number">Номер авто</label>
            <input class="form-control" id="number" name="number" type="text" placeholder="Enter number" required>
        </p>
        <p>
            <label class="form-label" for="vin_code">Він код</label>
            <input class="form-control" id="vin_code" name="vin_code" type="text" placeholder="Enter vin code" required>
        </p>
        <p>
            <label class="form-label" for="brand">Бренд</label>
            <input class="form-control" id="brand" name="brand" type="text" placeholder="Enter brand" required>
        </p>
        <p>
            <label class="form-label" for="model">Модель</label>
            <input class="form-control" id="model" name="model" type="text" placeholder="Enter model" required>
        </p>
        <button class="btn btn-primary mb-3" type="submit">Додати</button>
    </form>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        var urlParts = window.location.pathname.split('/');
        var clientId = urlParts[urlParts.length - 3];
        var carForm = document.querySelector('#carForm');
        var clientIdField = document.querySelector('#clientId');

        clientIdField.value = clientId;

        carForm.addEventListener('submit', function (event) {
            event.preventDefault();

            var formData = new FormData(carForm);
            var xhr = new XMLHttpRequest();

            xhr.open('POST', '/carservice/clients/' + clientId + '/cars');
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
                    console.log('Car created successfully!');
                    showSuccessMessage();
                    setTimeout(redirectToCarsPage, 1500);
                }
            };
            xhr.send(JSON.stringify(Object.fromEntries(formData)));
        });

        function showSuccessMessage() {
            var successAlert = document.createElement('div');
            successAlert.classList.add('alert', 'alert-success');
            successAlert.textContent = 'A new car added';

            var container = document.querySelector('.container');
            container.insertBefore(successAlert, carForm);
        }

        function redirectToCarsPage() {
            window.location.href = '/carservice/clients/' + clientId + '/cars';
        }
    });
</script>

</body>
</html>
