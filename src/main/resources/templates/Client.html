<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Авто клієнта</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 30px;
        }

        .card {
            margin-bottom: 20px;
            cursor: pointer;
        }

        #clientsList {
            max-height: 550px;
            overflow-y: auto;
        }

        .card-title {
            font-weight: bold;
        }

        .card-text {
            color: #6c757d;
        }

        .create-car-button, .update-car-button {
            margin-top: 10px;
            margin-left: 5px;
            width: 120px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-form {
            display: flex;
            margin-bottom: 10px;
        }

        .search-input {
            flex-grow: 1;
            margin-right: 10px;
        }

        .search-button {
            width: 100px;
        }

        .pagination {
            justify-content: center;
        }

        .custom-new-client{
            width: auto;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="http://localhost:8080/carservice/clients">Мої
                        клієнти</a>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="text-center mb-4">Мої клієнти</h1>

    <div class="search-container">
        <form class="search-form" th:action="@{/carservice/clients/}" method="get">
            <input class="form-control search-input" type="search" placeholder="Search" aria-label="Search"
                   name="search">
            <button class="btn btn-outline-primary search-button" type="submit">Пошук</button>
        </form>
    </div>

    <div id="clientsList">
        <div th:each="client : ${clients}" class="card"
             th:onclick="|window.location='@{/carservice/clients/{clientId}/cars(clientId=${client.id})}'|">
            <div class="card-body">
                <h5 class="card-title" th:text="${client.name}"></h5>
                <p class="card-text" th:text="'Прізвище: ' + ${client.surname}"></p>
                <!--                <p class="card-text" th:text="'ID: ' + ${client.id}"></p>-->
                <p class="card-text" th:text="'Номер телефону: ' + ${client.phoneNumber}"></p>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/carservice/clients/{clientId}/update(clientId=${client.id})}"
                       class="btn btn-secondary update-car-button">Редагувати</a>

                    <form th:action="@{/carservice/clients/{clientId}/delete(clientId=${client.id})}"
                          method="post" onsubmit="return confirmDelete('Ви впевнені, що хочете видалити цей запис?')">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="btn btn-danger custom-delete">Видалити</button>
                    </form>

                    <script>
                        function confirmDelete() {
                            if (confirm('Ви впевнені, що хочете видалити цей запис?')) {
                                return true;  // Отправка формы
                            } else {
                                window.location.href = '/carservice/clients';  // Редирект при отмене
                                return false;
                            }
                        }
                    </script>

                </div>
                <div>

                    <a th:href="@{/carservice/clients/{clientId}/cars(clientId=${client.id})}"
                       class="btn btn-primary create-car-button custom-new-client">Авто клієнта</a>

                </div>
            </div>
        </div>
    </div>

    <!--    <nav aria-label="Page navigation example">-->
    <!--        <ul class="pagination">-->
    <!--            <li class="page-item"><a class="page-link" href="#">Попередня</a></li>-->
    <!--            <li class="page-item"><a class="page-link" href="#">1</a></li>-->
    <!--            <li class="page-item"><a class="page-link" href="#">2</a></li>-->
    <!--            <li class="page-item"><a class="page-link" href="#">3</a></li>-->
    <!--            <li class="page-item"><a class="page-link" href="#">Наступна</a></li>-->
    <!--        </ul>-->
    <!--    </nav>-->

    <div class="text-end mt-4">
        <a th:href="@{/carservice/clients/add}" class="btn btn-primary create-client-button">Новий клієнт</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
