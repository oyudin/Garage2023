<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CarService</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="http://localhost:8080/carservice/clients">Мої
                        клієнти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Авто</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Обслуговування</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="text-center mb-4">Історія обслуговування авто</h1>
    <div id="partsList">
        <div th:each="serviceHistory : ${serviceHistories}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${serviceHistory.service_date}">Дата обслуговування</h5>
                    <p class="card-text" th:text="'Пробіг авто: ' + ${serviceHistory.mileage} + ' км'"></p>
                    <p class="card-text" th:text="'Деталі: ' + ${serviceHistory.description}"></p>
                    <p class="card-text" th:text="'Ціна: ' + ${serviceHistory.price} + ' грн'"></p>
                    <p class="card-text"
                       th:text="'Наступне обслуговування: ' + ${serviceHistory.next_service_date}"></p>

                    <form th:action="@{'/carservice/clients/' + ${ignoredClientId} + '/cars/' + ${ignoredCarId} + '/service-history/' + ${serviceHistory.id} + '/print'}"
                          method="get">
                        <button type="submit" class="btn btn-primary generate-report">Згенерувати звіт</button>
                    </form>

                    <form th:action="@{'/carservice/clients/' + ${ignoredClientId} + '/cars/' + ${ignoredCarId} + '/service-history/' + ${serviceHistory.id} + '/delete'}"
                          method="post" onsubmit="return confirm('Ви впевнені, що хочете видалити цей запис?')">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="btn btn-danger">Видалити</button>
                    </form>

                    <div class="float-right">
                        <a th:href="@{'/carservice/clients/' + ${ignoredClientId} + '/cars/' + ${ignoredCarId} + '/service-history/' + ${serviceHistory.id} + '/update'}"
                           class="btn btn-primary create-car-button">Update</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка для генерации полного отчета после карточек -->

    <!-- Кнопки для возврата к списку авто и нового обслуговування -->
    <div class="d-flex justify-content-between mt-3">
        <a th:href="@{'/carservice/clients/' + ${ignoredClientId} + '/cars'}"
           class="btn btn-outline-primary custom-back-button">Повернутися до списку авто</a>
        <a th:href="@{'/carservice/clients/' + ${ignoredClientId} + '/cars/' + ${ignoredCarId} + '/service-history/add'}"
           class="btn btn-primary create-car-button">Нове обслуговування</a>
    </div>

    <form th:action="@{'/carservice/clients/' + ${ignoredClientId} + '/cars/' + ${ignoredCarId} + '/service-history/' + 'printAll'}"
          method="get">
        <button type="submit" class="btn btn-primary generate-full-report">Згенерувати повний звіт</button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
