<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Update Client</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-/Y6pD6FV/Vv2HJnA6t+vslU6fwYXjCFtcEpHbNJ0lyAFsXTsjBbfaDjzALeQsN6M" crossorigin="anonymous">
    <style>
        .form-wrapper {
            max-width: 400px;
            margin: auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-wrapper .form-control {
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-wrapper">
        <form id="updateClientForm">
            <h2 class="text-center mb-4">Оновити клієнта</h2>
            <input type="hidden" id="clientId" value="">

            <label for="name">Імʼя:</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Введіть імʼя" required>

            <label for="surname">Прізвище:</label>
            <input type="text" class="form-control" id="surname" name="surname" placeholder="Введіть прізвище" required>

            <label for="phoneNumber">Номер телефону:</label>
            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                   placeholder="Введіть номер телефону у форматі +380631234567"
                   required pattern="^\+?\d{1,3}\d{9}$"
                   title="Формат: 380631234567 або +380631234567">

            <button class="btn btn-secondary mb-3" id="backToClientsBtn" type="button">Повернутися до списку клієнтів</button>
            <button class="btn btn-primary" type="submit">Оновити</button>
        </form>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const urlParts = window.location.pathname.split('/');
        const clientId = parseInt(urlParts[urlParts.length - 2]);
        const clientForm = document.querySelector('#updateClientForm');
        const clientIdField = document.querySelector('#clientId');

        clientIdField.value = clientId;

        // Fetch existing client data
        fetch(`/carservice/clients/${clientId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Network error: ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                document.querySelector('#name').value = data.name || '';
                document.querySelector('#surname').value = data.surname || '';
                document.querySelector('#phoneNumber').value = data.phoneNumber || '';
            })
            .catch(error => console.error('Getting client data error', error));

        // Submit updated client data
        clientForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(clientForm);
            const xhr = new XMLHttpRequest();
            const updateUrl = `/carservice/clients/${clientId}/update`;

            xhr.open('PATCH', updateUrl);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
                    console.log('Client updated successfully!');
                    showSuccessMessage();
                    setTimeout(redirectToClientsPage, 2000);
                }
            };
            xhr.send(JSON.stringify(Object.fromEntries(formData)));
        });

        function showSuccessMessage() {
            const successAlert = document.createElement('div');
            successAlert.classList.add('alert', 'alert-success', 'mt-3');
            successAlert.textContent = 'Дані клієнта оновлено успішно.';

            const formWrapper = document.querySelector('.form-wrapper');
            formWrapper.appendChild(successAlert);
        }

        function redirectToClientsPage() {
            window.location.href = '/carservice/clients';
        }

        // Back button logic
        const backToClientsBtn = document.querySelector('#backToClientsBtn');
        backToClientsBtn.addEventListener('click', function () {
            redirectToClientsPage();
        });
    });
</script>
</body>
</html>
